<ion-content class="fondo-blanco">
  <main class="login">
    <p class="marca">Uber</p>

    <h1 class="login__titulo">Inicia sesión</h1>
    <p class="texto-secundario">Ingresa con tu correo y contraseña.</p>

    <form class="login__form" [formGroup]="form" (ngSubmit)="ingresar()" novalidate>
      <ion-input
        class="campo"
        formControlName="email"
        type="email"
        inputmode="email"
        autocomplete="email"
        label="Correo electrónico"
        labelPlacement="stacked"
        fill="outline"
        placeholder="nombre@correo.com"
        [errorText]="form.controls.email.hasError('required') ? 'Ingresa tu correo' : 'El formato del correo no es válido'"
      ></ion-input>

      <ion-input
        class="campo"
        formControlName="password"
        type="password"
        autocomplete="current-password"
        label="Contraseña"
        labelPlacement="stacked"
        fill="outline"
        errorText="Ingresa tu contraseña"
      ></ion-input>

      @if (error()) {
        <p class="alerta" role="alert">{{ error() }}</p>
      }

      <ion-button class="boton" type="submit" expand="block" [disabled]="cargando()">
        @if (cargando()) {
          <ion-spinner name="crescent"></ion-spinner>
        } @else {
          Continuar
        }
      </ion-button>
    </form>

    <section class="login__demo">
      <h2 class="etiqueta-seccion">Cuentas de prueba</h2>
      @for (cuenta of cuentasDemo; track cuenta.email) {
        <button type="button" class="login__cuenta" (click)="usarCuenta(cuenta.email)">
          <span>
            <strong>{{ cuenta.rol }}</strong>
            <span class="texto-secundario">{{ cuenta.email }}</span>
          </span>
          <span class="texto-secundario">123456</span>
        </button>
      }
    </section>
  </main>
</ion-content>
